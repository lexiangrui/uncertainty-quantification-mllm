<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MLLM 人类对齐裁决</title>
  <style>
    :root{--ink:#172027;--muted:#66727c;--paper:#f5f2eb;--card:#fffdf8;--line:#d9d3c8;--blue:#245c7a;--green:#287052;--red:#a53e39;--gold:#c18a32;--shadow:0 16px 44px rgba(42,39,32,.10)}
    *{box-sizing:border-box} body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}
    header{height:64px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;background:#18252d;color:white;position:sticky;top:0;z-index:4}
    .brand{font-family:Georgia,"Songti SC",serif;font-size:20px;letter-spacing:.03em}.blind{font-size:12px;padding:5px 10px;border:1px solid #64727a;border-radius:999px;color:#d8e0e4}
    main{max-width:1500px;margin:auto;padding:22px}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.tabs,.status{display:flex;background:#e8e4dc;padding:4px;border-radius:10px;gap:3px}
    button,select,input,textarea{font:inherit}button{cursor:pointer}.tab{border:0;background:transparent;padding:8px 13px;border-radius:7px;color:#56616a}.tab.active{background:white;color:var(--ink);box-shadow:0 1px 5px #0001}
    .progress{margin-left:auto;min-width:260px}.progress-label{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:4px}.track{height:7px;background:#ddd8cf;border-radius:9px;overflow:hidden}.bar{height:100%;background:var(--green);width:0;transition:.2s}
    .workspace{display:grid;grid-template-columns:minmax(360px,.85fr) minmax(500px,1.15fr);gap:18px}.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
    .media{min-height:560px;display:flex;flex-direction:column}.meta{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:13px}.tags{display:flex;gap:6px}.tag{border-radius:999px;padding:2px 8px;background:#e9eef0;color:#34515f}.tag.warn{background:#f5e7cd;color:#81591d}
    .image-wrap{background:#edeae3;min-height:380px;display:flex;align-items:center;justify-content:center;padding:18px}.image-wrap img{max-width:100%;max-height:520px;object-fit:contain;border-radius:6px}.no-image{color:var(--muted)}
    .question{padding:18px 20px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700;margin-bottom:5px}.question-text{font-size:17px}.refs{margin-top:14px;padding:12px;border-left:3px solid var(--gold);background:#fbf4e7}
    .detail{padding:20px 22px;min-height:560px}.section{margin-bottom:20px}.section-text{white-space:pre-wrap;background:#f4f3ef;border:1px solid #e1ddd5;border-radius:9px;padding:12px;max-height:170px;overflow:auto}.answer{border-left:3px solid var(--blue)}
    .decision{border-top:1px solid var(--line);padding-top:18px}.decision-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.task{border:1px solid var(--line);border-radius:10px;padding:13px}.task.disabled{display:none}.task-title{font-weight:700;margin-bottom:9px}.choice-row{display:flex;gap:8px}.choice{flex:1;border:1px solid var(--line);background:white;border-radius:8px;padding:9px}.choice.selected.yes{background:#e2f2e9;border-color:var(--green);color:#195a3d}.choice.selected.no{background:#f8e3e1;border-color:var(--red);color:#862d28}
    .types{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:#faf9f6;border-radius:999px;padding:5px 9px;font-size:12px}.chip.selected{background:#e6edf1;border-color:var(--blue);color:#174d69}
    .form-row{display:grid;grid-template-columns:180px 1fr;gap:10px;margin-top:14px}.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:8px;background:white;padding:9px}.field textarea{resize:vertical;min-height:42px}
    footer{display:flex;align-items:center;justify-content:space-between;margin-top:14px}.nav{display:flex;gap:8px}.nav button{border:1px solid var(--line);background:white;border-radius:8px;padding:8px 14px}.save-state{font-size:12px;color:var(--muted)}.empty{text-align:center;padding:80px 20px;color:var(--muted)}
    @media(max-width:950px){.workspace{grid-template-columns:1fr}.media,.detail{min-height:auto}.progress{width:100%;margin-left:0}.decision-grid{grid-template-columns:1fr}.form-row{grid-template-columns:1fr}}
  </style>
</head>
<body>
<header><div class="brand">MLLM Human Alignment</div><div class="blind">双 Judge 盲裁 · 不展示来源标签</div></header>
<main>
  <div class="toolbar">
    <div class="tabs" id="taskTabs"><button class="tab active" data-filter="all">全部分歧</button><button class="tab" data-filter="correct">正确性</button><button class="tab" data-filter="hallucination">幻觉</button></div>
    <div class="status" id="statusTabs"><button class="tab active" data-status="pending">待裁决</button><button class="tab" data-status="all">全部</button><button class="tab" data-status="done">已完成</button></div>
    <div class="progress"><div class="progress-label"><span id="progressText">载入中</span><span id="position"></span></div><div class="track"><div class="bar" id="bar"></div></div></div>
  </div>
  <div id="content"></div>
</main>
<script>
const state={samples:[],annotations:{},filter:'all',status:'pending',visible:[],index:0,revisions:{}};
let saveChain=Promise.resolve();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function requiredDone(s,a){return(!s.disagreements.correct||typeof a.correct==='boolean')&&(!s.disagreements.hallucination||typeof a.hallucination==='boolean')}
function taskDone(s,a){if(state.filter==='correct')return !s.disagreements.correct||typeof a.correct==='boolean';if(state.filter==='hallucination')return !s.disagreements.hallucination||typeof a.hallucination==='boolean';return requiredDone(s,a)}
function refreshVisible(keepKey){state.visible=state.samples.filter(s=>{const task=state.filter==='all'||s.disagreements[state.filter];const done=taskDone(s,state.annotations[s.key]||{});return task&&(state.status==='all'||(state.status==='done')===done)});let i=keepKey?state.visible.findIndex(s=>s.key===keepKey):-1;state.index=i>=0?i:Math.min(state.index,Math.max(0,state.visible.length-1));render()}
function progress(){const done=state.samples.filter(s=>requiredDone(s,state.annotations[s.key]||{})).length;document.querySelector('#progressText').textContent=`已完成 ${done} / ${state.samples.length}`;document.querySelector('#bar').style.width=(state.samples.length?100*done/state.samples.length:0)+'%';document.querySelector('#position').textContent=state.visible.length?`${state.index+1} / ${state.visible.length}`:'0 / 0'}
function render(){progress();const host=document.querySelector('#content');if(!state.visible.length){host.innerHTML='<div class="panel empty">当前筛选下没有样本</div>';return}const s=state.visible[state.index],a=state.annotations[s.key]||{};const img=s.image_status==='available'?`<img src="/api/image?key=${encodeURIComponent(s.key)}" alt="样本图像">`:s.image_status==='not_applicable'?'<div class="no-image">该数据集样本不包含图像</div>':'<div class="no-image">图像尚未准备，禁止裁决</div>';const refs=(s.references||[]).map(x=>`<div>${esc(x)}</div>`).join('');const showCorrect=s.disagreements.correct&&state.filter!=='hallucination';const showHallucination=s.disagreements.hallucination&&state.filter!=='correct';host.innerHTML=`
<div class="workspace"><section class="panel media"><div class="meta"><span>${esc(s.model)} · ${esc(s.dataset)} · ${esc(s.sample_id)}</span><span class="tags">${s.disagreements.correct?'<b class="tag warn">正确性分歧</b>':''}${s.disagreements.hallucination?'<b class="tag warn">幻觉分歧</b>':''}</span></div><div class="image-wrap">${img}</div><div class="question"><div class="eyebrow">Question</div><div class="question-text">${esc(s.question)}</div><div class="refs"><div class="eyebrow">Reference answer</div>${refs}</div></div></section>
<section class="panel detail"><div class="section"><div class="eyebrow">Visual observations</div><div class="section-text">${esc(s.response.vision)}</div></div><div class="section"><div class="eyebrow">Reasoning</div><div class="section-text">${esc(s.response.reasoning)}</div></div><div class="section"><div class="eyebrow">Final answer</div><div class="section-text answer">${esc(s.response.answer)}</div></div>
<div class="decision"><div class="decision-grid"><div class="task ${showCorrect?'':'disabled'}"><div class="task-title">正确性最终标签</div><div class="choice-row"><button class="choice yes ${a.correct===true?'selected':''}" data-field="correct" data-value="true">正确</button><button class="choice no ${a.correct===false?'selected':''}" data-field="correct" data-value="false">错误</button></div></div><div class="task ${showHallucination?'':'disabled'}"><div class="task-title">幻觉最终标签</div><div class="choice-row"><button class="choice yes ${a.hallucination===true?'selected':''}" data-field="hallucination" data-value="true">有幻觉</button><button class="choice no ${a.hallucination===false?'selected':''}" data-field="hallucination" data-value="false">无幻觉</button></div><div class="types" style="display:${a.hallucination===true?'flex':'none'}"><button class="chip ${(a.hallucination_types||[]).includes('vision_hallucination')?'selected':''}" data-type="vision_hallucination">视觉幻觉</button><button class="chip ${(a.hallucination_types||[]).includes('reasoning_hallucination')?'selected':''}" data-type="reasoning_hallucination">推理幻觉</button></div></div></div>
<div class="form-row"><div class="field"><label>裁判姓名 / ID</label><input id="annotator" value="${esc(a.annotator||'')}"></div><div class="field"><label>备注（可选）</label><textarea id="notes">${esc(a.notes||'')}</textarea></div></div></div></section></div>
<footer><span class="save-state" id="saveState">${a.updated_at?'已保存':'尚未保存'}</span><div class="nav"><button id="prev">← 上一条</button><button id="next">下一条 →</button></div></footer>`;
bind(s,a)}
function markHuman(a,field){a.provenance=a.provenance||{};a.provenance[field]={kind:'human',model:null,updated_at:new Date().toISOString()}}
function bind(s,a){document.querySelectorAll('[data-field]').forEach(b=>b.onclick=()=>{a[b.dataset.field]=b.dataset.value==='true';markHuman(a,b.dataset.field);if(b.dataset.field==='hallucination'&&!a.hallucination)a.hallucination_types=[];state.annotations[s.key]=a;save(s,a)});document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{const values=new Set(a.hallucination_types||[]);values.has(b.dataset.type)?values.delete(b.dataset.type):values.add(b.dataset.type);a.hallucination_types=[...values];markHuman(a,'hallucination');state.annotations[s.key]=a;save(s,a)});for(const id of ['annotator','notes'])document.querySelector('#'+id).onchange=e=>{a[id]=e.target.value;state.annotations[s.key]=a;save(s,a,false)};document.querySelector('#prev').onclick=()=>move(-1);document.querySelector('#next').onclick=()=>move(1)}
function save(s,a,rerender=true){a.updated_at=new Date().toISOString();const revision=(state.revisions[s.key]||0)+1;state.revisions[s.key]=revision;const snapshot=JSON.parse(JSON.stringify(a));const mark=document.querySelector('#saveState');if(mark)mark.textContent='保存中…';saveChain=saveChain.catch(()=>{}).then(async()=>{const r=await fetch('/api/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:s.key,annotation:snapshot})});const out=await r.json();if(!r.ok)throw Error(out.error);if(state.revisions[s.key]===revision){state.annotations[s.key]=out.annotation;if(rerender)refreshVisible(s.key);else{const current=document.querySelector('#saveState');if(current)current.textContent='已保存'}}}).catch(e=>{if(state.revisions[s.key]===revision){const current=document.querySelector('#saveState');if(current)current.textContent='保存失败：'+e.message}});return saveChain}
function move(delta){state.index=Math.max(0,Math.min(state.visible.length-1,state.index+delta));render();scrollTo({top:0,behavior:'smooth'})}
document.querySelectorAll('#taskTabs .tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('#taskTabs .tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');state.filter=b.dataset.filter;state.index=0;refreshVisible()});document.querySelectorAll('#statusTabs .tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('#statusTabs .tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');state.status=b.dataset.status;state.index=0;refreshVisible()});
document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1)});
fetch('/api/state').then(r=>r.json()).then(x=>{state.samples=x.samples;state.annotations=x.annotations;refreshVisible()}).catch(e=>document.querySelector('#content').innerHTML=`<div class="panel empty">载入失败：${esc(e.message)}</div>`);
</script>
</body>
</html>
